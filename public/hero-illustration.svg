<svg width="440" height="360" viewBox="0 0 440 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PocketGoals savings illustration">
  <defs>
    <linearGradient id="pgTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pgPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pgCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- soft blobs -->
  <circle cx="90" cy="90" r="70" fill="#d1fae5"/>
  <circle cx="360" cy="70" r="50" fill="#dbeafe"/>
  <circle cx="380" cy="290" r="60" fill="#fce7f3"/>

  <!-- growth bars (chart) -->
  <rect x="70" y="230" width="46" height="70" rx="10" fill="url(#pgBlue)"/>
  <rect x="130" y="190" width="46" height="110" rx="10" fill="url(#pgPurple)"/>
  <rect x="190" y="150" width="46" height="150" rx="10" fill="url(#pgTeal)"/>

  <!-- upward arrow -->
  <path d="M80 210 L150 165 L210 130 L270 95" stroke="#0f766e" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M250 92 L272 92 L272 114" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- piggy bank body -->
  <ellipse cx="320" cy="215" rx="86" ry="66" fill="url(#pgTeal)"/>
  <circle cx="352" cy="196" r="7" fill="#ffffff"/>
  <path d="M250 205 q-18 -4 -22 16 q10 6 22 -2 Z" fill="url(#pgTeal)"/>
  <rect x="300" y="150" width="40" height="10" rx="5" fill="#0f766e"/>
  <rect x="290" y="270" width="14" height="26" rx="4" fill="#0f766e"/>
  <rect x="338" y="270" width="14" height="26" rx="4" fill="#0f766e"/>

  <!-- coin dropping -->
  <circle cx="320" cy="120" r="24" fill="url(#pgCoin)" stroke="#d97706" stroke-width="3"/>
  <text x="320" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309" font-family="system-ui, sans-serif">$</text>
</svg>
